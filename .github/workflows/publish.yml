name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION."
            exit 1
          fi

      - name: Verify
        run: pnpm test

      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          pnpm exec playwright install --with-deps chromium

      - name: Verify browser flows
        run: pnpm test:e2e

      - name: Build npm package
        run: |
          mkdir package-artifact
          npm pack --ignore-scripts --pack-destination package-artifact

      - name: Verify installed npm package
        run: node tools/package-smoke.ts package-artifact/vampire-*.tgz "$(node -p "require('./package.json').version")"

      - name: Upload verified npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package-artifact

      - name: Publish verified package
        run: node tools/publish-package.ts ./package-artifact/vampire-*.tgz "$(node -p "require('./package.json').version")"

  verify-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify package from npm registry
        run: node tools/package-smoke.ts "vampire@$(node -p "require('./package.json').version")" "$(node -p "require('./package.json').version")"
